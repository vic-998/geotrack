    <text x="0" y="56" fill="#687596" font-size="16" font-family="Microsoft YaHei, sans-serif">把原始 GPS 点，变成稳定、轻量、可分析的业务轨迹</text>
    <g transform="translate(0 80)" filter="url(#smallShadow)">
      <rect width="252" height="142" rx="20" fill="#fff" stroke="#e0e5f4" stroke-width="2"/>
      <circle cx="40" cy="42" r="24" fill="#eeefff"/>
      <path d="M29 43 L39 33 L51 45 L41 55 Z M38 31 L49 42" fill="none" stroke="#5b5cf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="77" y="40" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">轨迹抽稀</text>
      <text x="77" y="67" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">DP · VW · LTTB</text>
      <text x="24" y="111" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">保序降点，减少传输与存储</text>
    </g>
    <g transform="translate(274 80)" filter="url(#smallShadow)">
      <rect width="252" height="142" rx="20" fill="#fff" stroke="#e0e5f4" stroke-width="2"/>
      <circle cx="40" cy="42" r="24" fill="#e8f8fb"/>
      <path d="M28 50 C32 32 48 31 53 43 C55 49 51 56 43 56 C35 56 28 55 28 50 Z" fill="none" stroke="#17aabd" stroke-width="3"/>
      <path d="M35 49 L40 42 L46 48" fill="none" stroke="#17aabd" stroke-width="3" stroke-linecap="round"/>
      <text x="77" y="40" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">智能去噪</text>
      <text x="77" y="67" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">Kalman · RTS</text>
      <text x="24" y="111" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">在线滤波，离线平滑更稳</text>
    </g>
    <g transform="translate(0 240)" filter="url(#smallShadow)">
      <rect width="252" height="142" rx="20" fill="#fff" stroke="#e0e5f4" stroke-width="2"/>
      <circle cx="40" cy="42" r="24" fill="#fff4e8"/>
      <path d="M28 49 L40 31 L52 49 Z" fill="none" stroke="#f19b40" stroke-width="3" stroke-linejoin="round"/>
      <path d="M40 38 L40 44" stroke="#f19b40" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="48" r="2" fill="#f19b40"/>
      <text x="77" y="40" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">坐标纠偏</text>
      <text x="77" y="67" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">WGS84 · GCJ02 · BD09</text>
      <text x="24" y="111" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">批量转换，境外坐标不偏移</text>
    </g>
    <g transform="translate(274 240)" filter="url(#smallShadow)">
      <rect width="252" height="142" rx="20" fill="#fff" stroke="#e0e5f4" stroke-width="2"/>
      <circle cx="40" cy="42" r="24" fill="#edf7ef"/>
      <path d="M28 39 L40 31 L52 39 L40 47 Z M28 39 L28 52 L40 60 L52 52 L52 39 M40 47 L40 60" fill="none" stroke="#2aae76" stroke-width="3" stroke-linejoin="round"/>
