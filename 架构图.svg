    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#33427c" flood-opacity="0.12"/>
    </filter>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M 46 0 L 0 0 0 46" fill="none" stroke="#6d86c5" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6f79b8"/>
    </marker>
    <marker id="arrowBright" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f62ef"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <circle cx="1480" cy="-80" r="280" fill="#b9f2f0" opacity="0.27"/>
  <circle cx="80" cy="1040" r="300" fill="#d4d1ff" opacity="0.28"/>

  <!-- Header -->
