    <path d="M18 43 C18 29 27 22 36 22 C43 22 48 27 48 33 C48 43 38 48 28 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="19" cy="42" r="5" fill="#fff"/>
    <circle cx="47" cy="23" r="5" fill="#fff"/>
    <circle cx="32" cy="35" r="4" fill="#9ff5f5"/>
    <path d="M22 41 L29 36 L43 27" fill="none" stroke="#9ff5f5" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="30" fill="#101b3c" font-size="33" font-weight="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">渤溢云拓</text>
    <text x="85" y="57" fill="#5e6b8d" font-size="18" font-weight="600" letter-spacing="2" font-family="Arial, Microsoft YaHei, sans-serif">BOYI CLOUD  ·  GEOTRACK</text>
  </g>
  <g transform="translate(1060 42)">
    <text x="0" y="28" fill="#111d42" font-size="28" font-weight="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">让轨迹数据更轻、更准、更可用</text>
    <text x="1" y="59" fill="#667397" font-size="17" font-family="Microsoft YaHei, PingFang SC, sans-serif">Java 21 GPS 轨迹处理工具库 · v0.1.0</text>
  </g>
  <line x1="54" y1="128" x2="1546" y2="128" stroke="#dce3f4" stroke-width="2"/>

