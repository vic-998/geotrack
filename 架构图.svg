    <circle cx="177" cy="263" r="8" fill="#fff" stroke="#45deec" stroke-width="4"/>
    <circle cx="307" cy="264" r="8" fill="#fff" stroke="#45deec" stroke-width="4"/>
    <circle cx="416" cy="250" r="8" fill="#fff" stroke="#45deec" stroke-width="4"/>
    <circle cx="550" cy="132" r="11" fill="#26c4b4" stroke="#fff" stroke-width="4"/>
    <path d="M82 118 L147 82 L200 121 L276 94 L342 132 L409 82 L480 112 L540 82" fill="none" stroke="#7d8fc9" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M84 175 L129 141 L218 166 L277 146 L360 177 L449 145 L518 164" fill="none" stroke="#7d8fc9" stroke-opacity="0.27" stroke-width="3"/>
    <rect x="28" y="26" width="182" height="38" rx="12" fill="#273b6e" stroke="#5474bc" stroke-opacity="0.7"/>
    <text x="48" y="51" fill="#e9f5ff" font-size="17" font-weight="700" font-family="Arial, Microsoft YaHei, sans-serif">GEOTRACK / LIVE ROUTE</text>
    <text x="33" y="393" fill="#a9b7de" font-size="15" font-family="Arial, Microsoft YaHei, sans-serif">GPS points  12,480</text>
    <text x="218" y="393" fill="#a9b7de" font-size="15" font-family="Arial, Microsoft YaHei, sans-serif">distance  86.4 km</text>
    <text x="426" y="393" fill="#a9b7de" font-size="15" font-family="Arial, Microsoft YaHei, sans-serif">noise  −63%</text>
    <rect x="401" y="26" width="153" height="40" rx="13" fill="#21335f" stroke="#5e72c0" stroke-opacity="0.65"/>
    <circle cx="420" cy="46" r="6" fill="#32dfc1"/>
    <text x="435" y="52" fill="#d9fbf5" font-size="16" font-weight="600" font-family="Microsoft YaHei, sans-serif">轨迹已优化</text>
  </g>

  <!-- Capability cards -->
  <g transform="translate(674 158)">
