        <rect width="180" height="118" rx="18" fill="#fff" stroke="#dfe5f3" stroke-width="2"/>
        <circle cx="38" cy="39" r="23" fill="#f0efff"/><text x="38" y="47" text-anchor="middle" fill="#5d5df1" font-size="22" font-weight="700" font-family="Arial">01</text>
        <text x="76" y="42" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">导入</text>
        <text x="24" y="82" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">KML / GPX / 坐标串</text>
      </g>
      <g transform="translate(230 0)" filter="url(#smallShadow)">
        <rect width="180" height="118" rx="18" fill="#fff" stroke="#dfe5f3" stroke-width="2"/>
        <circle cx="38" cy="39" r="23" fill="#e8f8fb"/><text x="38" y="47" text-anchor="middle" fill="#12a7ba" font-size="22" font-weight="700" font-family="Arial">02</text>
        <text x="76" y="42" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">解析</text>
        <text x="24" y="82" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">GeoPoint 轨迹模型</text>
      </g>
      <g transform="translate(460 0)" filter="url(#smallShadow)">
        <rect width="180" height="118" rx="18" fill="#fff" stroke="#dfe5f3" stroke-width="2"/>
        <circle cx="38" cy="39" r="23" fill="#fff4e8"/><text x="38" y="47" text-anchor="middle" fill="#ef9840" font-size="22" font-weight="700" font-family="Arial">03</text>
        <text x="76" y="42" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">纠偏</text>
        <text x="24" y="82" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">WGS84 ↔ GCJ02 ↔ BD09</text>
      </g>
      <g transform="translate(690 0)" filter="url(#smallShadow)">
        <rect width="210" height="118" rx="18" fill="#fff" stroke="#dfe5f3" stroke-width="2"/>
        <circle cx="38" cy="39" r="23" fill="#edf7ef"/><text x="38" y="47" text-anchor="middle" fill="#29a875" font-size="22" font-weight="700" font-family="Arial">04</text>
        <text x="76" y="42" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">滤波与抽稀</text>
        <text x="24" y="82" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">Kalman · RTS · DP · LTTB</text>
      </g>
      <g transform="translate(950 0)" filter="url(#smallShadow)">
        <rect width="210" height="118" rx="18" fill="#fff" stroke="#dfe5f3" stroke-width="2"/>
        <circle cx="38" cy="39" r="23" fill="#f0efff"/><text x="38" y="47" text-anchor="middle" fill="#5d5df1" font-size="22" font-weight="700" font-family="Arial">05</text>
        <text x="76" y="42" fill="#1c294e" font-size="18" font-weight="700" font-family="Microsoft YaHei, sans-serif">分析输出</text>
        <text x="24" y="82" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">相似度 · 停留点 · 编码</text>
      </g>
      <g transform="translate(1210 0)" filter="url(#smallShadow)">
        <rect width="280" height="118" rx="18" fill="url(#flow)"/>
        <text x="28" y="38" fill="#fff" font-size="17" font-weight="700" font-family="Microsoft YaHei, sans-serif">接入你的业务系统</text>
        <text x="28" y="68" fill="#e7ffff" font-size="15" font-family="Microsoft YaHei, sans-serif">地图渲染 · 轨迹回放 · 位置服务</text>
        <path d="M222 37 h28 M236 25 l14 12 -14 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Bottom architecture and tech stack -->
  <g transform="translate(54 884)">
    <g filter="url(#smallShadow)">
      <rect width="1020" height="164" rx="22" fill="#fff" stroke="#e0e5f4" stroke-width="2"/>
      <text x="28" y="34" fill="#111d42" font-size="19" font-weight="700" font-family="Microsoft YaHei, sans-serif">核心模块</text>
      <text x="28" y="63" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">静态工具方法 · 线程安全 · 无隐藏状态</text>
      <line x1="333" y1="24" x2="333" y2="139" stroke="#e4e8f5" stroke-width="2"/>
      <line x1="680" y1="24" x2="680" y2="139" stroke="#e4e8f5" stroke-width="2"/>
      <text x="368" y="42" fill="#29375c" font-size="15" font-weight="700" font-family="Microsoft YaHei, sans-serif">数据与坐标</text>
      <text x="368" y="72" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">GeoPoint · KML / GPX Parser</text>
      <text x="368" y="101" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">WGS84 / GCJ02 / BD09</text>
      <text x="368" y="130" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">Encoded Polyline · Geohash</text>
      <text x="714" y="42" fill="#29375c" font-size="15" font-weight="700" font-family="Microsoft YaHei, sans-serif">算法与分析</text>
      <text x="714" y="72" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">DP · Visvalingam-Whyatt · LTTB</text>
      <text x="714" y="101" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">Fréchet · Hausdorff · DTW</text>
      <text x="714" y="130" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">球面质心 · 停留点检测</text>
    </g>
    <g transform="translate(1050 0)" filter="url(#smallShadow)">
      <rect width="496" height="164" rx="22" fill="#101b3c"/>
      <text x="28" y="35" fill="#a9b8e5" font-size="14" font-family="Arial, Microsoft YaHei, sans-serif">BUILD WITH CONFIDENCE</text>
      <text x="28" y="70" fill="#fff" font-size="22" font-weight="700" font-family="Microsoft YaHei, sans-serif">Java 21 · Maven · Apache 2.0</text>
      <text x="28" y="103" fill="#c8d4f5" font-size="15" font-family="Microsoft YaHei, sans-serif">无 Spring · 无数据库 · 纯 JDK + 少量依赖</text>
      <rect x="28" y="121" width="440" height="1" fill="#50618f"/>
      <text x="28" y="146" fill="#8eeaf0" font-size="14" font-family="Arial, Microsoft YaHei, sans-serif">com.boyicloud:geotrack:0.1.0</text>
    </g>
