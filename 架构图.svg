    <rect x="0" y="0" width="585" height="426" rx="24" fill="url(#grid)"/>
    <path d="M35 339 C107 284 119 311 177 263 S275 211 307 264 S359 331 416 250 S498 186 550 132" fill="none" stroke="#687fd6" stroke-opacity="0.25" stroke-width="22" stroke-linecap="round"/>
