<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">渤溢云拓 GeoTrack 产品设计图</title>
  <desc id="desc">Java 21 GPS 轨迹处理工具库的产品能力和技术架构总览</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="0.55" stop-color="#f1f4ff"/>
      <stop offset="1" stop-color="#eefafd"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#605cf6"/>
      <stop offset="1" stop-color="#2bb9cf"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b3c"/>
      <stop offset="1" stop-color="#182d5b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6160f5"/>
      <stop offset="1" stop-color="#21b6c9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
