    <text x="0" y="55" fill="#687596" font-size="16" font-family="Microsoft YaHei, sans-serif">模块之间保持清晰的数据流，直接嵌入你的地图、出行与位置服务</text>
    <path d="M129 145 H1402" stroke="#a4acd2" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
    <g transform="translate(0 86)">
