      <text x="77" y="67" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">KML · GPX · Polyline</text>
      <text x="24" y="111" fill="#657292" font-size="14" font-family="Microsoft YaHei, sans-serif">解析输入，兼容地图数据源</text>
    </g>
